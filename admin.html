<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educator & Admin Portal - AutoScribe</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header" role="banner">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon" aria-hidden="true">A</div>
      <span>AutoScribe Admin</span>
    </a>
    <nav class="header-nav" role="navigation">
      <button id="toggleContrastBtn" class="btn btn-secondary">👁️ High Contrast</button>
      <a href="index.html" class="btn btn-secondary">Exit Admin</a>
    </nav>
  </header>

  <main class="main-content" role="main">
    <div class="welcome-banner">
      <h1 style="font-size: 2rem;">👨‍🏫 Teacher & Exam Coordinator Portal</h1>
      <p style="color: var(--text-secondary);">Manage question banks, inspect voice-recorded student submissions, and export answer documents.</p>
    </div>

    <!-- Create Exam Form -->
    <section class="card" aria-labelledby="create-exam-heading">
      <h2 id="create-exam-heading" class="card-title">➕ Create New Voice Examination</h2>
      <form id="createExamForm">
        <div class="grid-2">
          <div class="form-group">
            <label for="examTitle" class="form-label">Exam Title / Subject Name</label>
            <input type="text" id="examTitle" class="form-control" placeholder="e.g., M.Sc Computer Science - Operating Systems" required>
          </div>
          <div class="form-group">
            <label for="examCode" class="form-label">Course Code</label>
            <input type="text" id="examCode" class="form-control" placeholder="e.g., CS-202" required>
          </div>
        </div>

        <div class="form-group">
          <label for="examDuration" class="form-label">Exam Duration (Minutes)</label>
          <input type="number" id="examDuration" class="form-control" value="60" min="15" max="180" required>
        </div>

        <div class="form-group">
          <label for="q1Text" class="form-label">Question 1 Text</label>
          <textarea id="q1Text" class="form-control" placeholder="Enter question statement..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-large">💾 Publish Exam to Portal</button>
      </form>
    </section>

    <!-- Submissions View -->
    <section class="card" aria-labelledby="submissions-heading">
      <h2 id="submissions-heading" class="card-title">📥 Submitted Student Examinations</h2>
      
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 1.05rem;">
          <thead>
            <tr style="border-bottom: 2px solid var(--accent-gold); color: var(--accent-gold);">
              <th style="padding: 1rem;">Submission ID</th>
              <th style="padding: 1rem;">Student Details</th>
              <th style="padding: 1rem;">Exam ID</th>
              <th style="padding: 1rem;">Submitted At</th>
              <th style="padding: 1rem;">Action</th>
            </tr>
          </thead>
          <tbody id="submissionsTableBody">
            <!-- Rendered by admin.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/speech-engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
